<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Project | Zenvy</title>

  <meta
    name="description"
    content="Zenvy premium digital agency project case study."
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <script src="https://unpkg.com/lucide@latest"></script>

  <style>

    :root {
      --bg: #080808;
      --surface: #111111;
      --surface-2: #171717;
      --text: #f5f5f5;
      --muted: #929292;
      --muted-2: #626262;
      --border: rgba(255, 255, 255, 0.1);
      --lime: #8BD72D;
      --white: #ffffff;
      --black: #000000;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "DM Sans", sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
    }

    img {
      display: block;
      width: 100%;
      max-width: 100%;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
      border: 0;
      cursor: pointer;
    }

    .container {
      width: min(1200px, calc(100% - 48px));
      margin: 0 auto;
    }

    /* =========================
       NAVBAR
    ========================= */

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 24px 0;

      background:
        linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.92),
          rgba(0, 0, 0, 0.25),
          transparent
        );

      backdrop-filter: blur(10px);
    }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-family: "Space Grotesk", sans-serif;
      font-size: 27px;
      font-weight: 700;
      letter-spacing: -0.08em;
    }

    .logo span {
      color: var(--lime);
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      padding: 11px 17px;

      border: 1px solid var(--border);
      border-radius: 999px;

      background: rgba(255, 255, 255, 0.04);

      font-size: 12px;
      font-weight: 700;

      transition: 0.3s ease;
    }

    .back-btn:hover {
      background: var(--white);
      color: var(--black);
      transform: translateX(-4px);
    }

    /* =========================
       HERO
    ========================= */

    .project-hero {
      padding-top: 160px;
      padding-bottom: 90px;
    }

    .project-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;

      margin-bottom: 22px;
    }

    .project-category {
      color: var(--lime);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.2em;
    }

    .project-year {
      color: var(--muted-2);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }

    .project-title {
      max-width: 1100px;
      margin-bottom: 60px;

      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(55px, 10vw, 145px);
      font-weight: 700;
      line-height: 0.88;
      letter-spacing: -0.075em;
      text-transform: uppercase;

      overflow-wrap: anywhere;
    }

    .hero-image {
      width: 100%;
      height: min(63vw, 720px);
      min-height: 400px;

      object-fit: cover;
      border-radius: 12px;

      background: #111;
    }

    /* =========================
       INTRO
    ========================= */

    .project-intro {
      display: grid;

      grid-template-columns:
        minmax(180px, 0.8fr)
        minmax(0, 2fr);

      gap: 80px;

      padding: 110px 0;

      border-bottom:
        1px solid var(--border);
    }

    .section-label {
      color: #777;

      font-size: 10px;
      font-weight: 900;

      text-transform: uppercase;
      letter-spacing: 0.25em;
    }

    .intro-text {
      max-width: 850px;

      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(25px, 3.2vw, 43px);

      line-height: 1.25;
      letter-spacing: -0.045em;
    }

    /* =========================
       CASE STUDY
    ========================= */

    .case-section {
      display: grid;

      grid-template-columns:
        minmax(180px, 0.8fr)
        minmax(0, 2fr);

      gap: 80px;

      padding: 105px 0;

      border-bottom:
        1px solid var(--border);
    }

    .case-content h2 {
      margin-bottom: 28px;

      font-family:
        "Space Grotesk",
        sans-serif;

      font-size: clamp(38px, 5vw, 70px);

      line-height: 0.96;
      letter-spacing: -0.06em;
    }

    .case-content p {
      max-width: 800px;

      color: var(--muted);

      font-size: 18px;
      line-height: 1.8;
    }

    /* =========================
       SERVICES
    ========================= */

    .service-list {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 12px;
    }

    .service-item {
      min-height: 82px;

      display: flex;
      align-items: center;

      padding: 20px;

      border: 1px solid var(--border);

      background:
        rgba(255, 255, 255, 0.025);

      color: #ddd;

      font-size: 14px;
      font-weight: 600;

      transition: 0.3s ease;
    }

    .service-item:hover {
      background:
        rgba(139, 215, 45, 0.06);

      border-color:
        rgba(139, 215, 45, 0.35);

      transform:
        translateY(-3px);
    }

    /* =========================
       RESULTS
    ========================= */

    .results {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 14px;
    }

    .result-card {
      min-height: 175px;

      display: flex;
      align-items: flex-end;

      padding: 28px;

      border: 1px solid var(--border);

      background:
        linear-gradient(
          145deg,
          #171717,
          #0c0c0c
        );

      transition: 0.3s ease;
    }

    .result-card:hover {
      border-color:
        rgba(139, 215, 45, 0.35);

      transform:
        translateY(-4px);
    }

    .result-card span {
      font-family:
        "Space Grotesk",
        sans-serif;

      font-size: 21px;

      line-height: 1.25;

      letter-spacing: -0.025em;
    }

    /* =========================
       GALLERY
    ========================= */

    .gallery {
      padding: 120px 0;
    }

    .gallery-title {
      margin-bottom: 50px;

      font-family:
        "Space Grotesk",
        sans-serif;

      font-size:
        clamp(42px, 6vw, 80px);

      line-height: 0.95;

      letter-spacing:
        -0.065em;

      text-transform:
        uppercase;
    }

    .gallery-grid {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 18px;
    }

    .gallery-grid img {
      width: 100%;
      height: 520px;

      object-fit: cover;

      border-radius: 8px;

      transition:
        transform 0.6s ease;
    }

    .gallery-grid img:hover {
      transform:
        scale(0.985);
    }

    .gallery-grid img:first-child {
      grid-column:
        span 2;

      height:
        min(63vw, 740px);
    }

    /* =========================
       CTA
    ========================= */

    .cta {
      padding: 125px 0;

      border-top:
        1px solid var(--border);

      text-align:
        center;
    }

    .cta h2 {
      max-width: 950px;

      margin:
        0 auto 45px;

      font-family:
        "Space Grotesk",
        sans-serif;

      font-size:
        clamp(46px, 8vw, 105px);

      line-height: 0.93;

      letter-spacing:
        -0.07em;

      text-transform:
        uppercase;
    }

    .cta-button {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      gap: 10px;

      padding: 16px 28px;

      background:
        var(--white);

      color:
        var(--black);

      border-radius:
        999px;

      font-size:
        13px;

      font-weight:
        800;

      transition:
        0.3s ease;
    }

    .cta-button:hover {
      background:
        var(--lime);

      transform:
        translateY(-4px);
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      padding: 34px 0;

      border-top:
        1px solid var(--border);

      color:
        #555;

      font-size:
        11px;
    }

    .footer-inner {
      display: flex;

      align-items: center;

      justify-content:
        space-between;

      gap: 20px;
    }

    /* =========================
       ERROR PAGE
    ========================= */

    .error-page {
      min-height: 100vh;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 30px;

      text-align: center;
    }

    .error-page-inner {
      max-width: 650px;
    }

    .error-page h1 {
      margin:
        15px 0 20px;

      font-family:
        "Space Grotesk",
        sans-serif;

      font-size:
        clamp(48px, 8vw, 100px);

      line-height:
        0.94;

      letter-spacing:
        -0.07em;
    }

    .error-page p {
      margin-bottom:
        30px;

      color:
        var(--muted);
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 900px) {

      .container {
        width:
          min(100% - 36px, 1200px);
      }

      .project-hero {
        padding-top:
          135px;

        padding-bottom:
          75px;
      }

      .project-title {
        margin-bottom:
          42px;
      }

      .hero-image {
        min-height:
          350px;
      }

      .project-intro,
      .case-section {

        grid-template-columns:
          1fr;

        gap:
          30px;

        padding:
          80px 0;
      }

      .case-content p {
        max-width:
          none;
      }

      .gallery {
        padding:
          90px 0;
      }
    }

    @media (max-width: 600px) {

      .container {
        width:
          calc(100% - 28px);
      }

      .navbar {
        padding:
          15px 0;
      }

      .logo {
        font-size:
          22px;
      }

      .back-btn {
        padding:
          9px 12px;

        font-size:
          9px;

        gap:
          5px;
      }

      .project-hero {
        padding-top:
          105px;

        padding-bottom:
          50px;
      }

      .project-meta {
        gap:
          10px;

        margin-bottom:
          17px;
      }

      .project-category,
      .project-year {
        font-size:
          8px;

        letter-spacing:
          0.14em;
      }

      .project-title {
        margin-bottom:
          28px;

        font-size:
          clamp(43px, 15vw, 75px);

        line-height:
          0.91;

        letter-spacing:
          -0.065em;
      }

      .hero-image {
        height:
          62vw;

        min-height:
          245px;

        max-height:
          380px;

        border-radius:
          16px;
      }

      .project-intro,
      .case-section {
        gap:
          24px;

        padding:
          58px 0;
      }

      .section-label {
        font-size:
          8px;

        letter-spacing:
          0.18em;
      }

      .intro-text {
        font-size:
          24px;

        line-height:
          1.3;
      }

      .case-content h2 {
        font-size:
          39px;

        margin-bottom:
          18px;
      }

      .case-content p {
        font-size:
          15px;

        line-height:
          1.72;
      }

      .service-list,
      .results {
        grid-template-columns:
          1fr;
      }

      .service-item {
        min-height:
          65px;

        padding:
          15px;

        font-size:
          13px;
      }

      .result-card {
        min-height:
          125px;

        padding:
          20px;
      }

      .result-card span {
        font-size:
          17px;
      }

      .gallery {
        padding:
          65px 0;
      }

      .gallery-title {
        margin-bottom:
          27px;

        font-size:
          42px;
      }

      .gallery-grid {
        grid-template-columns:
          1fr;

        gap:
          10px;
      }

      .gallery-grid img,
      .gallery-grid img:first-child {
        grid-column:
          auto;

        width:
          100%;

        height:
          280px;

        border-radius:
          15px;
      }

      .cta {
        padding:
          78px 0;
      }

      .cta h2 {
        margin-bottom:
          32px;

        font-size:
          15vw;

        line-height:
          0.95;
      }

      .cta-button {
        width:
          100%;

        padding:
          15px 20px;

        font-size:
          12px;
      }

      footer {
        padding:
          28px 0;
      }

      .footer-inner {
        flex-direction:
          column;

        text-align:
          center;

        gap:
          8px;
      }
    }

    @media (max-width: 380px) {

      .container {
        width:
          calc(100% - 22px);
      }

      .project-title {
        font-size:
          14vw;
      }

      .intro-text {
        font-size:
          21px;
      }

      .case-content h2 {
        font-size:
          35px;
      }
    }

  </style>
</head>

    <!-- GALLERY -->

      </div>

    </section>


    <!-- CTA -->

    <section class="cta">

      <div class="container">

        <h2>
          Have a Project
          <br>
          In Mind?
        </h2>


        <a
          href="index.html#contact"
          class="cta-button"
        >

          Start a Project

          <i
            data-lucide="arrow-up-right"
            width="18"
            height="18"
          ></i>

        </a>

      </div>

    </section>

  </main>


  <!-- =========================
       FOOTER
  ========================== -->

      <span>
        © 2026 Zenvy. All rights reserved.
      </span>

      <span>
        Digital. Creative. Growth.
      </span>

    </div>

  </footer>
